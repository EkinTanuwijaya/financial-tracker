# Standalone production file. Do not merge with the development compose file.
name: finance-tracker-prod

x-app: &app
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *app
    image: postgres:16-alpine
    mem_limit: 512m
    environment:
      POSTGRES_USER: finance
      POSTGRES_DB: finance_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U finance -d finance_tracker"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    <<: *app
    image: redis:7-alpine
    mem_limit: 192m
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12

  ocr:
    <<: *app
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-ocr:${IMAGE_TAG:?Set IMAGE_TAG}
    mem_limit: 1536m
    cpus: 1.0
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - paddleocr_models:/root/.paddlex
      - paddle_cache:/root/.cache
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s

  backend:
    <<: *app
    image: ${IMAGE_PREFIX}-backend:${IMAGE_TAG}
    mem_limit: 512m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      PORT: "3001"
      DATABASE_URL: postgresql://finance:${POSTGRES_PASSWORD}@postgres:5432/finance_tracker?schema=public&connection_limit=5
      REDIS_URL: redis://redis:6379
      OCR_BASE_URL: http://ocr:8000
      CORS_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/docs-json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  dashboard:
    <<: *app
    image: ${IMAGE_PREFIX}-dashboard:${IMAGE_TAG}
    mem_limit: 384m
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  nginx:
    <<: *app
    image: nginx:stable-alpine
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/finance-tracker/tls:/etc/nginx/tls:ro
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  paddleocr_models:
  paddle_cache:
