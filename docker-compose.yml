version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-tracker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finance-tracker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ocr:
    build:
      context: .
      dockerfile: docker/ocr.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - paddleocr_models:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: finance-tracker-backend
    env_file:
      - .env
    environment:
      - PORT=3001
      - OCR_BASE_URL=http://ocr:8000
      - CORS_ORIGIN=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/finance_tracker?schema=public
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - AI_PROVIDER=${AI_PROVIDER}
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_MODEL=${AI_MODEL}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    ports:
      - "3001:3001"
    depends_on:
      ocr:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/package.json:/app/apps/backend/package.json
      - ./apps/backend/tsconfig.json:/app/apps/backend/tsconfig.json
      - ./apps/backend/nest-cli.json:/app/apps/backend/nest-cli.json
      - ./packages:/app/packages
    command: pnpm --filter @finance-tracker/backend run start:dev

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    container_name: finance-tracker-dashboard
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      # Mount only source + config files. Mounting the whole package
      # directory shadows the image's node_modules (which has working
      # pnpm symlinks) with the host's node_modules, whose symlinks
      # point to /mnt/host/d/... and do not resolve in the container.
      - ./apps/dashboard/src:/app/apps/dashboard/src
      - ./apps/dashboard/package.json:/app/apps/dashboard/package.json
      - ./apps/dashboard/tsconfig.json:/app/apps/dashboard/tsconfig.json
      - ./packages:/app/packages
    command: pnpm --filter @finance-tracker/dashboard run dev

volumes:
  postgres_data:
  redis_data:
  paddleocr_models:
