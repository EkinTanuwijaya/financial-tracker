version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-tracker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finance-tracker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: finance-tracker-backend
    environment:
      - PORT=3001
      - CORS_ORIGIN=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/finance_tracker?schema=public
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - AI_PROVIDER=${AI_PROVIDER}
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_MODEL=${AI_MODEL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages:/app/packages
      - backend_node_modules:/app/apps/backend/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - prisma_node_modules:/app/packages/prisma/node_modules
    command: pnpm --filter @finance-tracker/backend run start:dev

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    container_name: finance-tracker-dashboard
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./apps/dashboard:/app/apps/dashboard
      - ./packages:/app/packages
      - dashboard_node_modules:/app/apps/dashboard/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - prisma_node_modules:/app/packages/prisma/node_modules
    command: pnpm --filter @finance-tracker/dashboard run dev

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  dashboard_node_modules:
  shared_node_modules:
  prisma_node_modules: